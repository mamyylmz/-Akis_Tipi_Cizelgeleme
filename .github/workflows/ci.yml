name: PFSP CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Force Windows-style Git setting before checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Taillard working-tree line endings
        shell: python
        run: |
          from pathlib import Path
          files = sorted(Path("data/taillard").glob("ta*.txt"))
          assert len(files) == 3, files
          bad = [str(p) for p in files if b"\r\n" in p.read_bytes()]
          if bad:
              raise SystemExit(f"CRLF detected in canonical benchmark files: {bad}")
          print("LF PASS:", ", ".join(str(p) for p in files))

      - name: Show Git EOL attributes
        run: git ls-files --eol -- data/taillard

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full unittest suite
        run: python -m unittest discover -s tests -v

      - name: Verify PFSP reference instances
        run: python src/problem.py

      - name: Verify deterministic NEH baseline
        run: python tools/run_neh_baseline.py

      - name: Run course contract checks
        run: python src/main.py --check


      - name: Run repository integrity check
        run: python tools/check_repo_integrity.py

      - name: Run literature and paper structure check
        run: python docs/check_literature.py

      - name: Validate every final CSV against PFSP and exact FE contract
        run: python tools/check_experiment_outputs.py --raw-dir results/raw --runs 30 --seed-base 2026

      - name: Independently verify final manuscript numerical blocks and schedules
        run: python -B tools/prepare_paper_assets.py --check

      - name: Exploratory tie-sensitive Cmax inference (non-mutating)
        run: python tools/exploratory_tie_sensitivity.py

      - name: Build English NASE review-only Word preview
        if: runner.os == 'Linux'
        run: |
          python -m pip install python-docx==1.2.0
          python tools/build_nase_preview_docx.py

      - name: Upload unapproved NASE manuscript preview
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: PFSP-NASE-REVIEW-PREVIEW-NOT-APPROVED
          path: dist/PFSP_NASE_REVIEW_PREVIEW.docx
          if-no-files-found: error
